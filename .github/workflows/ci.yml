name: AuthMe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Required CI gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, authme]
    timeout-minutes: 90
    steps:
      - name: Check out AuthMe
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run AuthMe source and unit checks
        run: |
          set -a
          source .github/ci.env
          set +a
          npm run check
          npm test

      - name: Prepare AuthMe integration services
        run: |
          docker_config="$RUNNER_TEMP/docker-config-authme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$docker_config"
          printf '%s\n' '{"auths":{}}' > "$docker_config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          docker --config "$docker_config" pull postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          docker --config "$docker_config" pull redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99

      - name: Run AuthMe database, cache, and smoke tests
        run: |
          set -a
          source .github/ci.env
          set +a
          /opt/homebrew/bin/bash .github/ci-local.sh test

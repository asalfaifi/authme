name: Signed release and certification candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: authme-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: authme_release
          POSTGRES_USER: authme
          POSTGRES_PASSWORD: authme-release-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authme -d authme_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      AUTHME_PUBLIC_URL: https://authme.test
      AUTHME_PORT: "3000"
      AUTHME_REALMS: master
      DATABASE_URL: postgresql://authme:authme-release-ci-only@127.0.0.1:5432/authme_release
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTHME_DEV_MODE: "false"
      AUTHME_TRUST_PROXY: "false"
      AUTHME_LOG_LEVEL: error
    steps:
      - name: Check out exact tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up pinned BuildKit builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5
          platforms: linux/amd64
      - name: Validate immutable release coordinates
        shell: bash
        run: |
          package_version="$(node --input-type=commonjs -p "require('./package.json').version")"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if test "$GITHUB_EVENT_NAME" = push; then
            release_version="${GITHUB_REF_NAME#v}"
            test "$GITHUB_REF_NAME" = "v$package_version"
            test "$release_version" = "$package_version"
            release_channel=tag
            image_tag="$release_version"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            release_version="$package_version"
            release_channel=candidate
            image_tag="candidate-$GITHUB_SHA"
          fi
          {
            echo "AUTHME_RELEASE_VERSION=$release_version"
            echo "AUTHME_RELEASE_CHANNEL=$release_channel"
            echo "AUTHME_RELEASE_IMAGE_REPOSITORY=$image_repository"
            echo "AUTHME_RELEASE_IMAGE=$image_repository:$image_tag"
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
          } >> "$GITHUB_ENV"
      - name: Install exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify version tag signature
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r '.object.type' <<< "$tag_ref")" = tag
          tag_object_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          test "$(jq -r '.object.type' <<< "$tag_object")" = commit
          test "$(jq -r '.object.sha' <<< "$tag_object")" = "$GITHUB_SHA"
          test "$(jq -r '.verification.verified' <<< "$tag_object")" = true
          test "$(jq -r '.verification.reason' <<< "$tag_object")" = valid
      - name: Require external evidence for a stable release
        shell: bash
        env:
          EXTERNAL_RELEASE_EVIDENCE_B64: ${{ secrets.AUTHME_EXTERNAL_RELEASE_EVIDENCE_B64 }}
        run: |
          if test "$AUTHME_RELEASE_CHANNEL" != tag || [[ "$AUTHME_RELEASE_VERSION" == *-* ]]; then
            exit 0
          fi
          test -n "$EXTERNAL_RELEASE_EVIDENCE_B64"
          external_evidence="$RUNNER_TEMP/authme-external-release-evidence.json"
          printf '%s' "$EXTERNAL_RELEASE_EVIDENCE_B64" | base64 --decode > "$external_evidence"
          chmod 600 "$external_evidence"
          node scripts/verify-external-release-evidence.mjs \
            --manifest "$external_evidence" \
            --version "$AUTHME_RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --image-repository "$AUTHME_RELEASE_IMAGE_REPOSITORY"
          echo "AUTHME_EXTERNAL_RELEASE_EVIDENCE=$external_evidence" >> "$GITHUB_ENV"
      - name: Generate ephemeral release-validation secrets
        shell: bash
        run: |
          AUTHME_JWKS_DIR="$RUNNER_TEMP/authme-jwks"
          mkdir -p "$AUTHME_JWKS_DIR"
          {
            echo "AUTHME_JWKS_DIR=$AUTHME_JWKS_DIR"
            echo "AUTHME_COOKIE_KEYS=$(openssl rand -hex 32),$(openssl rand -hex 32)"
            echo "AUTHME_CSRF_SECRET=$(openssl rand -hex 32)"
            echo "AUTHME_PASSWORD_PEPPER=$(openssl rand -hex 32)"
            echo "AUTHME_SUBJECT_SALT=$(openssl rand -hex 32)"
            echo "AUTHME_FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
            echo "AUTHME_ADMIN_TOKEN=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Generate realm signing keys
        run: npm run keys:generate
      - name: Apply exact migration set
        run: npm run db:migrate
      - name: Validate source and tests
        run: npm run check && npm test
      - name: Run non-skipping PostgreSQL release tests
        run: npm run test:postgres
      - name: Run PostgreSQL protocol smoke test
        env:
          AUTHME_SMOKE_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Helm release and build runtime image
        shell: bash
        run: |
          ./scripts/check-helm.sh
          build_runtime() {
            docker buildx build --pull --no-cache --target runtime --platform linux/amd64 \
              --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${AUTHME_RELEASE_VERSION}" \
              --tag "$AUTHME_RELEASE_IMAGE" \
              --output "type=docker,dest=$1,rewrite-timestamp=true" .
          }
          primary_archive="$RUNNER_TEMP/authme-primary.tar"
          reproduction_archive="$RUNNER_TEMP/authme-reproduction.tar"
          build_runtime "$primary_archive"
          build_runtime "$reproduction_archive"
          docker load --input "$primary_archive"
          primary_id="$(docker image inspect "$AUTHME_RELEASE_IMAGE" --format '{{.Id}}')"
          primary_layers="$(docker image inspect "$AUTHME_RELEASE_IMAGE" --format '{{json .RootFS.Layers}}')"
          docker image rm "$AUTHME_RELEASE_IMAGE"
          docker load --input "$reproduction_archive"
          reproduction_id="$(docker image inspect "$AUTHME_RELEASE_IMAGE" --format '{{.Id}}')"
          reproduction_layers="$(docker image inspect "$AUTHME_RELEASE_IMAGE" --format '{{json .RootFS.Layers}}')"
          test "$primary_id" = "$reproduction_id"
          test "$primary_layers" = "$reproduction_layers"
          rm -f "$primary_archive" "$reproduction_archive"
      - name: Validate hardened runtime migration entrypoint
        run: |
          docker run --rm --entrypoint sh "$AUTHME_RELEASE_IMAGE" -c '
            test "$(id -u)" = 1000
            command -v node >/dev/null
            for tool in npm npx corepack pnpm pnpx yarn yarnpkg; do
              ! command -v "$tool" >/dev/null
            done
            test -f scripts/migrate.mjs
            test -f scripts/bootstrap-user.mjs
          '
          docker run --rm --network host \
            --env DATABASE_URL \
            --entrypoint node \
            "$AUTHME_RELEASE_IMAGE" scripts/migrate.mjs
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          cache: true
          version: v0.72.0
      - name: Scan runtime image, deployment configuration, and repository secrets
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --quiet "$AUTHME_RELEASE_IMAGE"
          trivy config --severity HIGH,CRITICAL --exit-code 1 --quiet \
            --ignorefile .trivyignore.yaml .
          trivy fs --scanners secret --exit-code 1 --quiet .
      - name: Install pinned Syft SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      - name: Inventory the exact runtime image
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: |
          image_sbom="$RUNNER_TEMP/authme-image-sbom.raw.cdx.json"
          "$SYFT_COMMAND" "$AUTHME_RELEASE_IMAGE" \
            --output "cyclonedx-json=$image_sbom" --quiet
          echo "AUTHME_RELEASE_IMAGE_SBOM=$image_sbom" >> "$GITHUB_ENV"
      - name: Load release signing key
        env:
          RELEASE_KEY: ${{ secrets.AUTHME_RELEASE_SIGNING_KEY_B64 }}
        run: |
          test -n "$RELEASE_KEY"
          printf '%s' "$RELEASE_KEY" | base64 --decode > "$RUNNER_TEMP/authme-release-key.pem"
          chmod 600 "$RUNNER_TEMP/authme-release-key.pem"
          openssl pkey -in "$RUNNER_TEMP/authme-release-key.pem" -noout -check
          echo "AUTHME_RELEASE_SIGNING_KEY=$RUNNER_TEMP/authme-release-key.pem" >> "$GITHUB_ENV"
      - name: Publish the exact gated runtime image
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$AUTHME_RELEASE_IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $AUTHME_RELEASE_IMAGE" >&2
            exit 1
          fi
          docker push "$AUTHME_RELEASE_IMAGE"
          digest="$(docker buildx imagetools inspect "$AUTHME_RELEASE_IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_reference="$AUTHME_RELEASE_IMAGE_REPOSITORY@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "AUTHME_RELEASE_IMAGE_REFERENCE=$image_reference" >> "$GITHUB_ENV"
      - name: Bind stable evidence to the published image
        run: |
          if test "$AUTHME_RELEASE_CHANNEL" != tag || [[ "$AUTHME_RELEASE_VERSION" == *-* ]]; then
            exit 0
          fi
          node scripts/verify-external-release-evidence.mjs \
            --manifest "$AUTHME_EXTERNAL_RELEASE_EVIDENCE" \
            --version "$AUTHME_RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --image-repository "$AUTHME_RELEASE_IMAGE_REPOSITORY" \
            --image-reference "$AUTHME_RELEASE_IMAGE_REFERENCE"
      - name: Build signed archive, package/image SBOMs, and checksums
        run: npm run release:artifacts -- --require-image
      - name: Attest signed release files
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - name: Attest runtime image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.AUTHME_RELEASE_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest runtime image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.AUTHME_RELEASE_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: dist/authme-image-sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify published release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/authme-${AUTHME_RELEASE_VERSION}.tgz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$AUTHME_RELEASE_IMAGE" --repo "$GITHUB_REPOSITORY"
      - name: Log out of the container registry
        if: always()
        run: docker logout ghcr.io
      - name: Publish immutable tag artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

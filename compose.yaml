name: authme

services:
  authme:
    build:
      context: .
      target: runtime
    image: ${AUTHME_IMAGE:-authme:local}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      AUTHME_PUBLIC_URL: ${AUTHME_PUBLIC_URL:?Set AUTHME_PUBLIC_URL in .env}
      AUTHME_PORT: "3000"
      AUTHME_REALMS: ${AUTHME_REALMS:-master}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-}
      AUTHME_JWKS_DIR: /run/secrets/authme-jwks
      AUTHME_COOKIE_KEYS: ${AUTHME_COOKIE_KEYS:?Set AUTHME_COOKIE_KEYS in .env}
      AUTHME_CSRF_SECRET: ${AUTHME_CSRF_SECRET:?Set AUTHME_CSRF_SECRET in .env}
      AUTHME_PASSWORD_PEPPER: ${AUTHME_PASSWORD_PEPPER:?Set AUTHME_PASSWORD_PEPPER in .env}
      AUTHME_SUBJECT_SALT: ${AUTHME_SUBJECT_SALT:?Set AUTHME_SUBJECT_SALT in .env}
      AUTHME_FIELD_ENCRYPTION_KEY: ${AUTHME_FIELD_ENCRYPTION_KEY:?Set AUTHME_FIELD_ENCRYPTION_KEY in .env}
      AUTHME_ADMIN_TOKEN: ${AUTHME_ADMIN_TOKEN:?Set AUTHME_ADMIN_TOKEN in .env}
      AUTHME_CLIENTS_JSON: ${AUTHME_CLIENTS_JSON:-}
      AUTHME_ENABLE_DYNAMIC_REGISTRATION: ${AUTHME_ENABLE_DYNAMIC_REGISTRATION:-false}
      AUTHME_DEV_MODE: "false"
      AUTHME_DEV_ADMIN_PASSWORD: ""
      AUTHME_TRUST_PROXY: ${AUTHME_TRUST_PROXY:-true}
      AUTHME_LOG_LEVEL: ${AUTHME_LOG_LEVEL:-info}
      AUTHME_AUDIT_RETENTION_DAYS: ${AUTHME_AUDIT_RETENTION_DAYS:-90}
    ports:
      - "${AUTHME_BIND_ADDRESS:-127.0.0.1}:${AUTHME_HOST_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${AUTHME_JWKS_HOST_DIR:-./.local/jwks}
        target: /run/secrets/authme-jwks
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.AUTHME_PORT || '3000') + '/health/ready')
          .then((response) => { if (!response.ok) process.exitCode = 1; })
          .catch(() => { process.exitCode = 1; })
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks:
      - edge
      - data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authme}
      POSTGRES_USER: ${POSTGRES_USER:-authme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    profiles:
      - cache
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    read_only: true
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data

networks:
  edge: {}
  data:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}

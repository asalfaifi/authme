{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authme.fullname" . }}
  labels:
    {{- include "authme.labels" . | nindent 4 }}
data:
  AUTHME_PUBLIC_URL: {{ required "config.publicUrl is required" .Values.config.publicUrl | quote }}
  AUTHME_PORT: "3000"
  AUTHME_REALMS: {{ join "," .Values.config.realms | quote }}
  AUTHME_TRUST_PROXY: {{ ternary "true" "false" .Values.config.trustProxy | quote }}
  AUTHME_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AUTHME_AUDIT_RETENTION_DAYS: {{ .Values.config.auditRetentionDays | quote }}
  AUTHME_ENABLE_DYNAMIC_REGISTRATION: {{ ternary "true" "false" .Values.config.enableDynamicRegistration | quote }}
  AUTHME_ACCESS_TOKEN_TTL_SECONDS: {{ .Values.config.accessTokenTtlSeconds | quote }}
  AUTHME_AUTHORIZATION_CODE_TTL_SECONDS: {{ .Values.config.authorizationCodeTtlSeconds | quote }}
  AUTHME_SESSION_TTL_SECONDS: {{ .Values.config.sessionTtlSeconds | quote }}
  AUTHME_WEBAUTHN_CHALLENGE_TTL_SECONDS: {{ .Values.config.webauthnChallengeTtlSeconds | quote }}
  {{- range $key, $value := .Values.config.extraData }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
